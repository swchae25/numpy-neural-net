[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nnumpy"
version = "0.1.0"
description = "A small neural-network library written from scratch in NumPy, with gradient checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seung Wook Chae" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
examples = ["matplotlib>=3.7", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
